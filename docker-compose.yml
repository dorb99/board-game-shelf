# Runs the production image locally: docker compose up --build, then http://localhost:8080
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      # These win over backend/.env, so a local run never touches the live database.
      DATABASE_URL: postgresql://library:library@db/library
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    volumes:
      - library-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 2s
      retries: 15

volumes:
  library-db:
