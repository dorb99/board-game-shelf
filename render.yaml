# Render blueprint: New > Blueprint, pick this repository.
services:
  - type: web
    name: board-game-shelf
    runtime: docker
    plan: free
    healthCheckPath: /api/owners
    envVars:
      # The free plan has no disk, so the library lives in an outside Postgres database.
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
